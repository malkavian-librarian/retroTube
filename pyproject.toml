[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "retro_tool.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests", "retros", "boards", "voting", "actions", "realtime"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
  migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
